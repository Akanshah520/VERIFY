name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ingredient-agent \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 1.5Gi \
            --min-instances 1 \
            --project project-2b3a64e8-5d0b-4415-9ad \
            --set-env-vars GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}